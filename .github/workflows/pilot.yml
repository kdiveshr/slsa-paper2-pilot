# SLSA Paper 2 pilot — 2-3 projects only (Nov 22, 2026)
# Mints real SLSA provenance in GitHub Actions for Paper 1 Maven JARs and
# uploads the JARs so slsa-verifier can be run locally against them.
# All tamper is self-inflicted on own copies; no real secrets; no upstream.
# NOTE: provenance source URI is this pilot repo's workflow (the builder),
# not the project repo — the full run kept this setup and discloses it as a
# caveat in the paper. The digest-binding matrix is unaffected.
name: slsa-pilot
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # P7 Fintech-Payment-Processing-API — 1 artifact, TIMESTAMP only
          - project: fintech
            repo: Pawan-Ghode/Fintech-Payment-Processing-API
            ref: 15e317198b08e78526dc525487baca6e00277935
            variant: unfixed
            env: env1
            runs-on: ubuntu-24.04
          - project: fintech
            repo: Pawan-Ghode/Fintech-Payment-Processing-API
            ref: 15e317198b08e78526dc525487baca6e00277935
            variant: unfixed
            env: env2
            runs-on: ubuntu-22.04
          - project: fintech
            repo: kdiveshr/Fintech-Payment-Processing-API
            ref: eee7403bd9a06677021bb4de74adfd04bd9b310f
            variant: fixed
            env: env1
            runs-on: ubuntu-24.04
          - project: fintech
            repo: kdiveshr/Fintech-Payment-Processing-API
            ref: eee7403bd9a06677021bb4de74adfd04bd9b310f
            variant: fixed
            env: env2
            runs-on: ubuntu-22.04
          - project: fintech
            repo: Pawan-Ghode/Fintech-Payment-Processing-API
            ref: 15e317198b08e78526dc525487baca6e00277935
            variant: compromise
            env: env1
            runs-on: ubuntu-24.04
          # P10 PetsUniverseSpringBoot — 1 artifact, TIMESTAMP only
          - project: pets
            repo: Thissvane/PetsUniverseSpringBoot
            ref: 0daf2f16dd0ac0c449fe5820d11f575d23efab4f
            variant: unfixed
            env: env1
            runs-on: ubuntu-24.04
          - project: pets
            repo: Thissvane/PetsUniverseSpringBoot
            ref: 0daf2f16dd0ac0c449fe5820d11f575d23efab4f
            variant: unfixed
            env: env2
            runs-on: ubuntu-22.04
          - project: pets
            repo: kdiveshr/PetsUniverseSpringBoot
            ref: be499f20b93b08c2be831101a0990d77bf4ca781
            variant: fixed
            env: env1
            runs-on: ubuntu-24.04
          - project: pets
            repo: kdiveshr/PetsUniverseSpringBoot
            ref: be499f20b93b08c2be831101a0990d77bf4ca781
            variant: fixed
            env: env2
            runs-on: ubuntu-22.04
          - project: pets
            repo: Thissvane/PetsUniverseSpringBoot
            ref: 0daf2f16dd0ac0c449fe5820d11f575d23efab4f
            variant: compromise
            env: env1
            runs-on: ubuntu-24.04
          # P20 desafio-itau-backend — 1 artifact, TIMESTAMP only
          - project: itau
            repo: JoseOtavioJunqueira/desafio-itau-backend
            ref: 1d409ea98ddb943c9fca2d7faf63c5dd9a520d86
            variant: unfixed
            env: env1
            runs-on: ubuntu-24.04
          - project: itau
            repo: JoseOtavioJunqueira/desafio-itau-backend
            ref: 1d409ea98ddb943c9fca2d7faf63c5dd9a520d86
            variant: unfixed
            env: env2
            runs-on: ubuntu-22.04
          - project: itau
            repo: kdiveshr/desafio-itau-backend
            ref: dc2f9a29a33ece1404db31810922575c03350b62
            variant: fixed
            env: env1
            runs-on: ubuntu-24.04
          - project: itau
            repo: kdiveshr/desafio-itau-backend
            ref: dc2f9a29a33ece1404db31810922575c03350b62
            variant: fixed
            env: env2
            runs-on: ubuntu-22.04
          - project: itau
            repo: JoseOtavioJunqueira/desafio-itau-backend
            ref: 1d409ea98ddb943c9fca2d7faf63c5dd9a520d86
            variant: compromise
            env: env1
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout target at pinned commit
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: src

      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Build (Paper 1 command; SOURCE_DATE_EPOCH exported in-step)
        working-directory: src
        run: |
          mvn -version
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          mvn -B package -DskipTests

      - name: Locate built JAR
        id: jar
        run: |
          JAR=$(ls src/target/*.jar | head -n 1)
          test -n "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"

      - name: Arm (e) compromise injection — self-inflicted, marker only
        if: matrix.variant == 'compromise'
        run: |
          python3 - <<'PYEOF'
          import zipfile
          jar = "${{ steps.jar.outputs.jar }}"
          with zipfile.ZipFile(jar, "a") as z:
              z.writestr("PILOT-COMPROMISE-MARKER.txt",
                         "self-inflicted pilot tamper, no real secret\n")
          PYEOF
          sha256sum "${{ steps.jar.outputs.jar }}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.jar.outputs.jar }}

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.variant }}-${{ matrix.env }}
          path: ${{ steps.jar.outputs.jar }}
          if-no-files-found: error

  # Legacy/comparison spot-check (1 project only): slsa-github-generator
  # generic @v2.1.0 — frozen, unmaintained since Aug 2026. Proves whether
  # the legacy route still runs on current runners (Node 20 -> 24 forced)
  # and whether slsa-verifier verifies its .intoto.jsonl.
  gen-build:
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout fintech at pinned commit
        uses: actions/checkout@v4
        with:
          repository: Pawan-Ghode/Fintech-Payment-Processing-API
          ref: 15e317198b08e78526dc525487baca6e00277935
          path: src
      - name: Set up Temurin 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Build (Paper 1 command; SOURCE_DATE_EPOCH exported in-step)
        working-directory: src
        run: |
          mvn -version
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          mvn -B package -DskipTests
      - name: Hash JAR
        id: hash
        run: |
          JAR=$(ls src/target/*.jar | head -n 1)
          test -n "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "hashes=$(sha256sum "$JAR" | base64 -w0)" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: fintech-generator-build
          path: src/target/*.jar
          if-no-files-found: error

  gen-provenance:
    needs: [gen-build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.gen-build.outputs.hashes }}"
      upload-assets: false

