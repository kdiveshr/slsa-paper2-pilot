    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout target at pinned commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: src

      - name: Set up Temurin 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: "17"
          distribution: temurin

      - name: Install pinned Maven 3.9.9 (FAIL unless 3.9.9)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o apache-maven-3.9.9-bin.tar.gz "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz" || curl -fsSL -o apache-maven-3.9.9-bin.tar.gz "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz"
          curl -fsSL -o apache-maven-3.9.9-bin.tar.gz.sha512 "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz.sha512" || curl -fsSL -o apache-maven-3.9.9-bin.tar.gz.sha512 "https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz.sha512"
          echo "$(awk '{print $1}' apache-maven-3.9.9-bin.tar.gz.sha512)  apache-maven-3.9.9-bin.tar.gz" | sha512sum -c -
          tar -xzf apache-maven-3.9.9-bin.tar.gz
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/apache-maven-3.9.9/bin/mvn" -version

      - name: Build (Paper 1 command; SOURCE_DATE_EPOCH exported in-step)
        working-directory: src
        run: |
          set -euo pipefail
          java -version
          mvn -version
          mvn -version | grep -q "Apache Maven 3.9.9" || { echo "FATAL: Maven is not 3.9.9 — refusing to build on 3.10.1"; exit 1; }
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
          mvn -B package -DskipTests

      - name: Locate built JAR
        id: jar
        run: |
          JAR="src/${{ matrix.jar }}"
          test -f "$JAR" || { echo "FATAL: representative JAR not found: $JAR"; ls src/target/*.jar 2>/dev/null || true; exit 1; }
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"

      - name: Arm (e) compromise injection — self-inflicted, marker only
        if: matrix.variant == 'compromise'
        run: |
          python3 - <<'PYEOF'
          import zipfile
          jar = "${{ steps.jar.outputs.jar }}"
          with zipfile.ZipFile(jar, "a") as z:
              z.writestr("FULLRUN-COMPROMISE-MARKER.txt",
                         "self-inflicted full-run tamper, no real secret\n")
          PYEOF
          sha256sum "${{ steps.jar.outputs.jar }}"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ steps.jar.outputs.jar }}

      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.project }}-${{ matrix.variant }}-${{ matrix.env }}
          path: ${{ steps.jar.outputs.jar }}
          if-no-files-found: error
          retention-days: 3

