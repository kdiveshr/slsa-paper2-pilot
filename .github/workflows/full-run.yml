# Provenance source URI is this pilot repo's workflow (the builder), not each
# project's fork — digest-binding matrix unaffected; disclose in the paper.
# Attest: actions/attest-build-provenance@v2, SHA-pinned below (recorded in
# verify-results.json). Generator arm must stay tag-pinned @v2.1.0 (SHA fails).
