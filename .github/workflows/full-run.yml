      - name: Hash JAR
        id: hash
        run: |
          JAR="src/target/fintech-payment-processing-api-0.0.1-SNAPSHOT.jar"
          test -f "$JAR" || { echo "FATAL: representative JAR not found: $JAR"; exit 1; }
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "hashes=$(sha256sum "$JAR" | base64 -w0)" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fintech-generator-build
          path: src/target/fintech-payment-processing-api-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 3

